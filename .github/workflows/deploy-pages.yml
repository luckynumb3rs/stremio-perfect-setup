name: Deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the pulled wizard stats back to main
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jekyll dependencies
        run: gem install jekyll -v 4.4.1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-analytics-data google-auth requests cryptography

      - name: Pull wizard stats from GA4
        continue-on-error: true # keep deploying with the stats already in the repo
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: python3 scripts/pull-ga4-daily.py

      - name: Build guide completion stats
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: python3 scripts/build-guide-stats.py

      - name: Commit wizard stats
        run: |
          git add assets/data/wizard-stats
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update wizard stats"
          # pushes made with GITHUB_TOKEN do not start another workflow run
          git pull --rebase origin main && git push || echo "::warning::stats push failed; the next run re-pulls these days"

      - name: Prepare staged site source
        run: |
          rm -rf .pages-source
          scripts/prepare-site-source.sh .pages-source

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: jekyll build --source ./.pages-source --destination ./_site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wizard/web/package-lock.json

      - name: Build wizard
        run: |
          cd wizard/web
          npm ci
          npm run build

      - name: Copy wizard build into site
        run: |
          mkdir -p _site/wizard
          cp -r wizard/web/dist/. _site/wizard/

      - name: Prepare Pages publish directory
        run: |
          rm -rf .pages-publish
          mkdir -p .pages-publish
          cp -R _site/. .pages-publish/

      - name: Verify rendered guide output
        run: |
          test -s .pages-publish/index.html
          test -s .pages-publish/guide/0-Beginner-Concepts/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages-publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
